h="103.5596" x="513.62" y="279.106">hor&#225;rio programado.</text></g><g class="entity" data-qualified-name="GMN5" data-source-line="67" id="ent0006"><path d="M309.37,553.1006 L309.37,589.8406 L274.55,593.8406 L309.37,597.8406 L309.37,634.585 A5,5 0 0 0 314.37,639.585 L497.7284,639.585 A5,5 0 0 0 502.7284,634.585 L502.7284,558.1006 L492.7284,548.1006 L314.37,548.1006 A5,5 0 0 0 309.37,553.1006" fill="#FFFDE7" filter="url(#friu8kom4mdph)" style="stroke:#F9A825;stroke-width:1;"/><path d="M492.7284,548.1006 L492.7284,555.6006 A2.5,2.5 0 0 0 495.2284,558.1006 L502.7284,558.1006 L492.7284,548.1006" fill="#FFFDE7" style="stroke:#F9A825;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="10" font-weight="bold" lengthAdjust="spacing" textLength="96.2646" x="315.37" y="562.3829">Estado de Atraso</text><text fill="#000000" font-family="Verdana" font-size="10" lengthAdjust="spacing" textLength="90.2539" x="315.37" y="574.0235">O sistema verifica</text><text fill="#000000" font-family="Verdana" font-size="10" lengthAdjust="spacing" textLength="102.4023" x="315.37" y="585.6641">periodicamente se o</text><text fill="#000000" font-family="Verdana" font-size="10" lengthAdjust="spacing" textLength="98.5156" x="315.37" y="597.3047">hor&#225;rio passou sem</text><text fill="#000000" font-family="Verdana" font-size="10" lengthAdjust="spacing" textLength="141.5967" x="315.37" y="608.9454">o medicamento ser tomado.</text><text fill="#000000" font-family="Verdana" font-size="10" lengthAdjust="spacing" textLength="121.2061" x="315.37" y="620.586">Pode ser marcado como</text><text fill="#000000" font-family="Verdana" font-size="10" lengthAdjust="spacing" textLength="172.3584" x="315.37" y="632.2266">tomado mesmo estando atrasado.</text></g><g class="entity" data-qualified-name="GMN8" data-source-line="77" id="ent0009"><path d="M506.95,951.9106 L506.95,988.6506 L472.65,992.6506 L506.95,996.6506 L506.95,1033.395 A5,5 0 0 0 511.95,1038.395 L666.1434,1038.395 A5,5 0 0 0 671